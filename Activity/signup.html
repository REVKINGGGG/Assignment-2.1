<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <script src="signup-validation.js" defer></script>
    <title>Check It - Signup</title>
</head>
<body>
    <div class="navbar">
        <a href="index.html" class="logo">Check It</a>
        <div class="nav-links">
            <a href="login.html" id="login">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF">
                    <path d="M367-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm296.5-343.5Q560-607 560-640t-23.5-56.5Q513-720 480-720t-56.5 23.5Q400-673 400-640t23.5 56.5Q447-560 480-560t56.5-23.5ZM480-640Zm0 400Z"/>
                </svg>
            </a>
        </div>
    </div>
    <div class="glass-card">
        <div class="wrapper">
            <h1>Signup</h1>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <input type="text" id="first-name" placeholder="First Name" autocomplete="off" required>
                    <span class="error-message" id="first-name-error"></span>
                </div>
                <div class="form-group">
                    <input type="text" id="last-name" placeholder="Last Name" autocomplete="off" required>
                    <span class="error-message" id="last-name-error"></span>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email" autocomplete="off" required>
                    <span class="error-message" id="email-error"></span>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" autocomplete="off" required>
                    <span class="error-message" id="password-error"></span>
                </div>
                <div class="form-group">
                    <input type="password" id="confirm-password" placeholder="Confirm Password" autocomplete="off" required>
                    <span class="error-message" id="confirm-password-error"></span>
                </div>
                <button type="submit">Signup</button>
            </form>
            <a href="login.html" id="register">Already have an account? Log in</a>
        </div>
    </div>
</body>
</html>
